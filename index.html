<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IZCALLI v02.7</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.2/dist/aframe-extras.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
  <script src="https://unpkg.com/aframe-aabb-collider-component@3.2.1/dist/aframe-aabb-collider-component.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
      touch-action: none;
    }
    body { position: fixed; inset: 0; }
    a-scene { width: 100vw; height: 100vh; }

    #joyLeft, #joyRight {
      position: absolute;
      bottom: 20px;
      width: 160px;
      height: 160px;
      touch-action: none;
      opacity: 0;
      z-index: 9999;
      transition: opacity 0.12s linear;
      pointer-events: auto;
    }
    #joyLeft { left: 20px; }
    #joyRight { right: 20px; }

    #debugVR {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10000;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 10px;
      border-radius: 8px;
      max-width: 45vw;
      pointer-events: none;
    }

    #fullscreenBtn {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 10001;
      font-family: sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.9);
      color: #111;
      display: none;
    }
  </style>
</head>

<body>
  <div id="joyLeft"></div>
  <div id="joyRight"></div>
  <div id="debugVR">Esperando datos del control...</div>
  <button id="fullscreenBtn" type="button">Pantalla completa</button>

  <img id="handGif" src="assets/hand.gif" crossorigin="anonymous" loading="eager" style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;">
  <canvas id="handFreezeCanvas" width="1080" height="1920" style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;"></canvas>

  <a-scene
    vr-mode-ui="enabled: true"
    fog="type: exponential; color: #000000; density: 0.15"
    background="color: #B2B2B2"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; sortObjects: true"
    shadow="type: pcfsoft">

    <video id="stormVideo" src="assets/0527.mp4" autoplay muted loop playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>
    <video id="tvVideo" src="assets/noti.mp4" autoplay muted loop playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>

    <a-assets>
      <a-asset-item id="nino" src="assets/ninopt.glb"></a-asset-item>
      <a-asset-item id="mama" src="assets/mama.glb"></a-asset-item>
      <a-asset-item id="abuelitajusta" src="assets/abuelitajusta.glb"></a-asset-item>
      <a-asset-item id="abuelitamar" src="assets/abuelitamar.glb"></a-asset-item>
      <a-asset-item id="mesa" src="assets/mesa.glb"></a-asset-item>
      <a-asset-item id="librero" src="assets/librero.glb"></a-asset-item>
      <a-asset-item id="libros" src="assets/libros.glb"></a-asset-item>
      <a-asset-item id="sillon" src="assets/sillon.glb"></a-asset-item>
      <a-asset-item id="tele" src="assets/tele.glb"></a-asset-item>
      <a-asset-item id="cuadros" src="assets/cuadros.glb"></a-asset-item>
      <a-asset-item id="velasyplatos" src="assets/velasyplatos.glb"></a-asset-item>
      <a-asset-item id="salon" src="assets/salon.glb"></a-asset-item>
      <a-asset-item id="puertas" src="assets/puertas.glb"></a-asset-item>
      <a-asset-item id="altar" src="assets/altar.glb"></a-asset-item>
      <a-asset-item id="perchero" src="assets/perchero.glb"></a-asset-item>
      <a-asset-item id="plantas" src="assets/plantas.glb"></a-asset-item>
      <a-asset-item id="navmesh" src="assets/navmesh.glb"></a-asset-item>

      <audio id="audio1" src="assets/audio1.mp3"></audio>
      <audio id="audio2" src="assets/audio2.mp3"></audio>
      <audio id="audio3" src="assets/audio3.mp3"></audio>
      <audio id="audio4" src="assets/audio4.mp3"></audio>
      <audio id="audio5" src="assets/audio5.mp3"></audio>
      <audio id="audio6" src="assets/audio6.mp3"></audio>
      <audio id="audio7" src="assets/audio7.mp3"></audio>
      <audio id="audio8" src="assets/audio8.mp3"></audio>
      <audio id="audio9" src="assets/audio9.mp3"></audio>

      <video id="video1" src="assets/video1.mp4"></video>
      <video id="video2" src="assets/video2.mp4"></video>
      <video id="video3" src="assets/video3.mp4"></video>
      <video id="video4" src="assets/video4.mp4"></video>

      <video id="introVideo" src="assets/intro.mp4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="cinematicVideo" preload="auto" playsinline webkit-playsinline></video>
    </a-assets>

    <a-entity id="navmeshEntity" gltf-model="#navmesh" nav-mesh visible="false"></a-entity>

    <a-entity gltf-model="#mesa"></a-entity>
    <a-entity gltf-model="#librero"></a-entity>
    <a-entity gltf-model="#libros"></a-entity>
    <a-entity gltf-model="#salon"></a-entity>
    <a-entity gltf-model="#sillon"></a-entity>
    <a-entity gltf-model="#tele"></a-entity>
    <a-entity gltf-model="#cuadros"></a-entity>
    <a-entity gltf-model="#velasyplatos"></a-entity>
    <a-entity gltf-model="#puertas"></a-entity>
    <a-entity gltf-model="#altar"></a-entity>
    <a-entity gltf-model="#perchero"></a-entity>
    <a-entity gltf-model="#plantas"></a-entity>

    <a-entity gltf-model="#mama" animation-mixer="clip: talk; loop: repeat; timeScale: 1"></a-entity>
    <a-entity gltf-model="#abuelitajusta" animation-mixer="clip: talkabu; loop: repeat; timeScale: 1"></a-entity>
    <a-entity gltf-model="#abuelitamar" animation-mixer="clip: talkabu; loop: repeat; timeScale: 1"></a-entity>

    <a-video src="#stormVideo" position="-2.3 2.94 -3.1" width="3.5" height="2.3"></a-video>
    <a-video src="#tvVideo" position="-3.46 1.88 1.941" rotation="0 180 0" width="0.88" height="0.74"></a-video>

    <a-box class="trigger" id="trigger1" position="-6.3 1 0.13" width="0.5" height="2" depth="1" visible="false" data-audio="audio1"></a-box>
    <a-box class="trigger" id="trigger2" position="-5.5 1 -2.7" width="1" height="2" depth="0.5" visible="false" data-audio="audio4"></a-box>
    <a-box class="trigger" id="trigger3" position="-6.3 1 -1.5" width="0.5" height="2" depth="0.7" visible="false" data-audio="audio2"></a-box>
    <a-box class="trigger" id="trigger4" position="-3.45 1 2" width="2" height="2" depth="1" visible="false" data-video="video2"></a-box>
    <a-box class="trigger" id="trigger5" position="-2.3 1 -2.7" width="3" height="2" depth="1" visible="false" data-video="video1"></a-box>
    <a-box class="trigger" id="trigger6" position="0 1 -2.7" width="1" height="2" depth="1" visible="false" data-audio="audio6"></a-box>
    <a-box class="trigger" id="trigger7" position="-1.6 1 2.7" width="1" height="2" depth="0.5" visible="false" data-video="video3"></a-box>
    <a-box class="trigger" id="trigger8" position="0.25 1 2.7" width="1" height="2" depth="0.5" visible="false" data-audio="audio8"></a-box>
    <a-box class="trigger" id="trigger9" position="2.2 1 2.7" width="1" height="2" depth="0.5" visible="false" data-audio="audio9"></a-box>

    <a-entity id="rig" position="0 0 0">
      <a-entity id="player" gltf-model="#nino" visible="false"></a-entity>
      <a-entity id="cameraPivot" position="0 1.5 0">
        <a-entity id="cameraYaw">
          <a-entity id="cameraBoom">
            <a-entity id="gameCamera" camera look-controls="pointerLockEnabled: false; reverseMouseDrag: false">
              <a-plane id="introScreen" visible="false" position="0 0 -0.8" width="4" height="2.25" material="src: #introVideo; shader: flat; transparent: true; side: double; depthTest: false; depthWrite: false"></a-plane>
              <a-plane id="cinematicScreen" visible="false" position="0 0 -0.8" width="4" height="2.25" material="src: #cinematicVideo; shader: flat; transparent: true; side: double; depthTest: false; depthWrite: false"></a-plane>
              <a-plane id="handSprite" position="0 0 -1" width="3" height="1.7" gif-texture-updater material="src: #handGif; shader: flat; transparent: true; side: double; depthTest: false; depthWrite: false"></a-plane>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-light type="point" color="#ff9d3d" intensity="1.2" distance="4" decay="2" position="2 2 0"></a-light>
    <a-light type="point" color="#ffffff" intensity="2.5" distance="8" decay="2" position="-3.4 1.5 1"></a-light>
    <a-light type="point" color="#ff9d3d" intensity="1.2" distance="8" decay="2" position="-6 2.2 0"></a-light>
  </a-scene>

  <script>
    AFRAME.registerComponent('gif-texture-updater', {
      tick: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh || !mesh.material) return;
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        materials.forEach(material => {
          if (material.map) material.map.needsUpdate = true;
          material.needsUpdate = true;
        });
      }
    });

    function requestFullscreenIfPossible() {
      const el = document.documentElement;
      try {
        if (document.fullscreenElement) return Promise.resolve(true);
        if (el.requestFullscreen) return el.requestFullscreen().then(() => true).catch(() => false);
        if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); return Promise.resolve(true); }
        if (el.msRequestFullscreen) { el.msRequestFullscreen(); return Promise.resolve(true); }
      } catch (err) {}
      return Promise.resolve(false);
    }

    function setupFullscreenHandlers() {
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const tryEnter = () => requestFullscreenIfPossible().then(ok => {
        if (fullscreenBtn) fullscreenBtn.style.display = ok ? 'none' : 'block';
      });
      if (fullscreenBtn) fullscreenBtn.addEventListener('click', tryEnter);
      window.addEventListener('pointerdown', tryEnter, { once: true, passive: true });
      window.addEventListener('touchstart', tryEnter, { once: true, passive: true });
      window.addEventListener('click', tryEnter, { once: true });
      document.addEventListener('fullscreenchange', () => {
        if (fullscreenBtn) fullscreenBtn.style.display = document.fullscreenElement ? 'none' : 'block';
      });
    }

    window.addEventListener('load', () => {
      setupFullscreenHandlers();

      const scene = document.querySelector('a-scene');
      const debugVR = document.querySelector('#debugVR');

      const rig = document.querySelector('#rig');
      const player = document.querySelector('#player');
      const camera = document.querySelector('#gameCamera');
      const navMeshEl = document.querySelector('#navmeshEntity');
      const introScreen = document.getElementById('introScreen');
      const introVideo = document.getElementById('introVideo');
      const cinematicScreen = document.getElementById('cinematicScreen');
      const cinematicVideo = document.getElementById('cinematicVideo');
      const handSprite = document.getElementById('handSprite');
      const handGif = document.getElementById('handGif');
      const handFreezeCanvas = document.getElementById('handFreezeCanvas');
      const handFreezeCtx = handFreezeCanvas.getContext('2d', { alpha: true });
      const stormVideo = document.getElementById('stormVideo');
      const tvVideo = document.getElementById('tvVideo');

      const activatedTriggers = new Set();
      let cinematicPlaying = false;
      let moving = false;
      let playerModelReady = false;
      let handFrozen = false;

      let keys = {};
      let nippleVector = new THREE.Vector2(0, 0);
      let lookInput = new THREE.Vector2(0, 0);
      let lastTime = performance.now();
      let lastHeadYaw = null;

      const IDLE_LIMIT = 3 * 60 * 1000;
      let idleTimer = null;

      const speed = 0.5;
      const rotationSmooth = 0.15;
      const deadZone = 0.15;
      const headTurnSpeed = 1.0;
      const headTurnThreshold = 0.0005;

      const raycaster = new THREE.Raycaster();
      const downVector = new THREE.Vector3(0, -1, 0);
      const playerBox = new THREE.Box3();
      const triggerBox = new THREE.Box3();

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(resetExperience, IDLE_LIMIT);
      }

      function activity() {
        resetIdleTimer();
      }

      ['mousemove','mousedown','mouseup','keydown','keyup','touchstart','touchmove','click','wheel','scroll','pointerdown','pointermove'].forEach(evt => {
        window.addEventListener(evt, activity, { passive: true });
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) activity(); });

      function unlockAmbientVideos() {
        [stormVideo, tvVideo].forEach(videoEl => {
          if (!videoEl) return;
          videoEl.muted = true;
          videoEl.loop = true;
          videoEl.autoplay = true;
          videoEl.playsInline = true;
          videoEl.load();
          const p = videoEl.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        });
      }

      function forceHandTextureUpdate() {
        const mesh = handSprite && handSprite.getObject3D('mesh');
        if (!mesh || !mesh.material) return;
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        materials.forEach(material => {
          if (material.map) material.map.needsUpdate = true;
          material.needsUpdate = true;
        });
      }

      function applyHandMaterial(srcSelector) {
        handSprite.setAttribute('material', `src: ${srcSelector}; shader: flat; transparent: true; side: double; depthTest: false; depthWrite: false`);
        setTimeout(forceHandTextureUpdate, 0);
      }

      function restoreAnimatedHand() {
        handFrozen = false;
        applyHandMaterial('#handGif');
      }

      function showHand() {
        handSprite.setAttribute('visible', 'true');
        restoreAnimatedHand();
      }

      function hideHand() {
        handSprite.setAttribute('visible', 'false');
      }

      function angleDifference(a, b) {
        const diff = b - a;
        return Math.atan2(Math.sin(diff), Math.cos(diff));
      }

      function setRigPosition(vec3) {
        rig.setAttribute('position', `${vec3.x} ${vec3.y} ${vec3.z}`);
      }

      function snapRigToNavmesh() {
        if (!navMeshEl.object3D) return;
        navMeshEl.object3D.updateMatrixWorld(true);
        const origin = rig.object3D.position.clone();
        origin.y += 5;
        raycaster.set(origin, downVector);
        const intersects = raycaster.intersectObject(navMeshEl.object3D, true);
        if (intersects.length > 0) {
          const pos = rig.object3D.position.clone();
          pos.y = intersects[0].point.y;
          setRigPosition(pos);
        }
      }

      function getFlatViewBasis() {
        const quat = new THREE.Quaternion();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        camera.object3D.getWorldQuaternion(quat);
        euler.setFromQuaternion(quat, 'YXZ');
        const yaw = euler.y;
        return {
          forward: new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw)),
          right: new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw))
        };
      }

      function getActiveControllerInput() {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (const gp of Array.from(pads).filter(Boolean)) {
          const ax0 = gp.axes[0] || 0;
          const ay0 = gp.axes[1] || 0;
          if (Math.abs(ax0) > deadZone || Math.abs(ay0) > deadZone) return { x: ax0, y: ay0 };
        }
        return null;
      }

      function activateTrigger(trigger) {
        if (activatedTriggers.has(trigger.id)) return;
        activatedTriggers.add(trigger.id);

        const audioId = trigger.getAttribute('data-audio');
        const videoId = trigger.getAttribute('data-video');

        if (audioId) {
          const audio = document.getElementById(audioId);
          if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
          }
        }

        if (videoId) {
          const video = document.getElementById(videoId);
          if (video) {
            cinematicPlaying = true;
            cinematicScreen.setAttribute('visible', 'true');
            cinematicVideo.pause();
            cinematicVideo.currentTime = 0;
            cinematicVideo.src = video.src;
            cinematicVideo.load();
            cinematicVideo.oncanplay = () => {
              cinematicVideo.play().catch(() => {});
            };
            cinematicVideo.onended = () => {
              cinematicScreen.setAttribute('visible', 'false');
              cinematicPlaying = false;
            };
          }
        }
      }

      function resetExperience() {
        activatedTriggers.clear();
        cinematicPlaying = false;
        moving = false;
        handFrozen = false;
        lastHeadYaw = null;
        nippleVector.set(0, 0);
        lookInput.set(0, 0);

        if (cinematicScreen) cinematicScreen.setAttribute('visible', 'false');
        if (introScreen) introScreen.setAttribute('visible', 'true');

        if (cinematicVideo) {
          cinematicVideo.pause();
          cinematicVideo.removeAttribute('src');
          cinematicVideo.load();
        }

        if (introVideo) {
          introVideo.pause();
          introVideo.currentTime = 0;
          introVideo.muted = false;
          introVideo.removeAttribute('muted');
          introVideo.volume = 1;
          introVideo.load();
          introVideo.play().catch(() => {});
        }

        if (rig) rig.setAttribute('position', '0 0 0');
        if (player) player.object3D.rotation.y = 0;

        unlockAmbientVideos();
        resetIdleTimer();
      }

      function tick() {
        resetIdleTimer();

        const now = performance.now();
        const delta = (now - lastTime) / 1000;
        lastTime = now;

        if (cinematicPlaying) {
          requestAnimationFrame(tick);
          return;
        }

        navMeshEl.object3D.updateMatrixWorld(true);

        const input = new THREE.Vector2(0, 0);
        if (keys['w'] || keys['arrowup']) input.y -= 1;
        if (keys['s'] || keys['arrowdown']) input.y += 1;
        if (keys['a'] || keys['arrowleft']) input.x -= 1;
        if (keys['d'] || keys['arrowright']) input.x += 1;
        input.x += nippleVector.x;
        input.y -= nippleVector.y;

        const controllerInput = getActiveControllerInput();
        if (controllerInput) {
          input.x += controllerInput.x;
          input.y += controllerInput.y;
        }

        const vrMode = scene.is && scene.is('vr-mode');
        if (vrMode) {
          const euler = new THREE.Euler(0, 0, 0, 'YXZ');
          euler.setFromQuaternion(camera.object3D.quaternion, 'YXZ');
          const currentHeadYaw = euler.y;
          if (lastHeadYaw !== null) {
            const deltaYaw = angleDifference(lastHeadYaw, currentHeadYaw);
            if (Math.abs(deltaYaw) > headTurnThreshold) rig.object3D.rotation.y += deltaYaw * headTurnSpeed;
          }
          lastHeadYaw = currentHeadYaw;
        } else {
          lastHeadYaw = null;
          const look = camera.components['look-controls'];
          if (look) {
            const rotSpeed = 1.5;
            look.yawObject.rotation.y -= lookInput.x * rotSpeed * delta;
            look.pitchObject.rotation.x -= lookInput.y * rotSpeed * delta;
            const maxPitch = Math.PI / 2 - 0.1;
            look.pitchObject.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, look.pitchObject.rotation.x));
          }
        }

        if (input.length() > 0) {
          input.normalize();
          const basis = getFlatViewBasis();
          const moveVector = new THREE.Vector3()
            .addScaledVector(basis.forward, -input.y)
            .addScaledVector(basis.right, input.x);

          const totalMove = moveVector.clone().multiplyScalar(speed * delta);
          const stepMove = totalMove.clone().divideScalar(8);
          let currentPosition = rig.object3D.position.clone();

          for (let i = 0; i < 8; i++) {
            let testFull = currentPosition.clone().add(stepMove);
            let origin = testFull.clone();
            origin.y += 5;
            raycaster.set(origin, downVector);
            const intersects = raycaster.intersectObject(navMeshEl.object3D, true);
            if (intersects.length > 0) {
              currentPosition.copy(testFull);
              currentPosition.y = intersects[0].point.y;
            }
          }

          setRigPosition(currentPosition);

          const moveAngle = Math.atan2(moveVector.x, moveVector.z);
          const targetRotation = moveAngle + Math.PI;
          const currentRotation = player.object3D.rotation.y;
          const diff = angleDifference(currentRotation, targetRotation);
          player.object3D.rotation.y += diff * rotationSmooth;

          if (!moving) {
            handSprite.setAttribute('visible', 'true');
            moving = true;
          }
        } else if (moving) {
          handSprite.setAttribute('visible', 'false');
          moving = false;
        }

        snapRigToNavmesh();

        if (playerModelReady) {
          player.object3D.updateMatrixWorld(true);
          playerBox.setFromObject(player.object3D);
          document.querySelectorAll('.trigger').forEach(trigger => {
            if (activatedTriggers.has(trigger.id)) return;
            trigger.object3D.updateMatrixWorld(true);
            triggerBox.setFromObject(trigger.object3D);
            if (playerBox.intersectsBox(triggerBox)) activateTrigger(trigger);
          });
        }

        requestAnimationFrame(tick);
      }

      function hideIntroAndStartExperience() {
        if (introScreen) introScreen.setAttribute('visible', 'false');
        if (introVideo) introVideo.pause();
        if (!started) {
          started = true;
          hideHand();
          tick();
        }
      }

      if (handGif) {
        handGif.addEventListener('load', () => {
          if (!handFrozen) restoreAnimatedHand();
        });
      }

      if (player) {
        player.addEventListener('model-loaded', () => {
          playerModelReady = true;
        });
      }

      if (introScreen && introVideo) {
        introScreen.setAttribute('visible', 'true');
        introVideo.loop = false;
        introVideo.muted = false;
        introVideo.removeAttribute('muted');
        introVideo.volume = 1.0;
        introVideo.load();
        introVideo.play().catch(() => {});
        introVideo.onended = hideIntroAndStartExperience;
      }

      if (navMeshEl) {
        navMeshEl.addEventListener('model-loaded', () => {
          if (!started) {
            started = true;
            hideHand();
            tick();
          }
        });
      }

      unlockAmbientVideos();
      resetIdleTimer();
    });
  </script>
</body>
</html>
